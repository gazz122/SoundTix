<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Rundown Acara · SoundTix</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #0f172a;
            --muted: #64748b;
            --line: #e2e8f0;
            --accent: #4f46e5;
            --accent-soft: #eef2ff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            background: #f8fafc;
            color: var(--ink);
            font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
        }

        main {
            width: min(720px, 100%);
            margin: 0 auto;
            padding: 24px 16px 48px;
        }

        .card {
            border: 1px solid var(--line);
            border-radius: 14px;
            background: #fff;
            padding: 24px;
            box-shadow: 0 1px 2px rgba(15, 23, 42, .05);
        }

        .eyebrow {
            margin: 0;
            color: var(--accent);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
        }

        h1 {
            margin: 4px 0 0;
            font-size: 24px;
            line-height: 1.25;
        }

        .meta {
            margin: 6px 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .note {
            margin: 14px 0 0;
            border-radius: 10px;
            background: #fffbeb;
            color: #92400e;
            padding: 10px 12px;
            font-size: 12px;
        }

        h2 {
            margin: 28px 0 10px;
            font-size: 18px;
        }

        .group + .group { margin-top: 24px; }

        .group-label {
            margin: 0 0 8px;
            color: var(--accent);
            font-size: 13px;
            font-weight: 600;
        }

        ol {
            margin: 0;
            padding: 0;
            list-style: none;
            display: grid;
            gap: 8px;
        }

        li {
            display: flex;
            gap: 16px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
            padding: 14px 16px;
        }

        li.live {
            border-color: #a5b4fc;
            background: var(--accent-soft);
        }

        .time {
            flex: 0 0 auto;
            min-width: 54px;
            color: var(--accent);
            font-size: 14px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        .time small {
            display: block;
            color: var(--muted);
            font-size: 11px;
            font-weight: 500;
        }

        .body { min-width: 0; }

        .stage { margin: 0; font-weight: 600; }

        .band { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

        .genre {
            display: inline-block;
            margin-top: 6px;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 1px 8px;
            color: var(--muted);
            font-size: 11px;
            font-weight: 600;
        }

        .live-badge {
            display: inline-block;
            margin-bottom: 4px;
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            padding: 1px 8px;
            font-size: 11px;
            font-weight: 700;
        }

        .empty {
            margin: 24px 0 0;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fff;
            padding: 32px 16px;
            color: var(--muted);
            font-size: 14px;
            text-align: center;
        }

        footer {
            margin-top: 28px;
            color: var(--muted);
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
<main id="app"></main>
<script>
    (function () {
        var app = document.getElementById('app');
        var hash = window.location.hash.slice(1);

        function escapeHtml(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
            });
        }

        function decode(hashValue) {
            var base64 = hashValue.replace(/-/g, '+').replace(/_/g, '/');
            var padded = base64 + '='.repeat((4 - (base64.length % 4)) % 4);
            var binary = atob(padded);
            var bytes = Uint8Array.from(binary, function (char) { return char.charCodeAt(0); });

            return JSON.parse(new TextDecoder().decode(bytes));
        }

        function formatDate(value) {
            if (!value) return '';

            var date = new Date(value + 'T00:00:00');

            return isNaN(date.getTime())
                ? value
                : date.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
        }

        function wibNow() {
            var parts = new Intl.DateTimeFormat('en-GB', {
                timeZone: 'Asia/Jakarta',
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hourCycle: 'h23',
            }).formatToParts(new Date());

            var map = {};

            parts.forEach(function (part) { map[part.type] = part.value; });

            return { date: map.year + '-' + map.month + '-' + map.day, time: map.hour + ':' + map.minute };
        }

        function itemHtml(item, date, now) {
            var live = date === now.date
                && item.s <= now.time
                && (!item.e || now.time < item.e);

            var stage = item.t || item.p || 'Penampilan';
            var band = item.t && item.p ? '<p class="band">' + escapeHtml(item.p) + '</p>' : '';

            return '<li class="' + (live ? 'live' : '') + '">'
                + '<div class="time">' + escapeHtml(item.s)
                + (item.e ? '<small>- ' + escapeHtml(item.e) + '</small>' : '')
                + '</div>'
                + '<div class="body">'
                + (live ? '<span class="live-badge">Sedang tampil</span>' : '')
                + '<p class="stage">' + escapeHtml(stage) + '</p>'
                + band
                + (item.g ? '<span class="genre">' + escapeHtml(item.g) + '</span>' : '')
                + '</div>'
                + '</li>';
        }

        function render(data) {
            var now = wibNow();
            var groups;

            if (data.m && Array.isArray(data.days) && data.days.length > 0) {
                groups = data.days.map(function (day) {
                    return {
                        label: 'Day ' + day.n + ' · ' + formatDate(day.d),
                        date: day.d,
                        items: (data.r || []).filter(function (item) { return item.day === day.i; }),
                    };
                });
            } else {
                groups = [{ label: null, date: data.d, items: data.r || [] }];
            }

            var list = groups.map(function (group) {
                var items = group.items.map(function (item) { return itemHtml(item, group.date, now); }).join('');

                return '<div class="group">'
                    + (group.label ? '<p class="group-label">' + escapeHtml(group.label) + '</p>' : '')
                    + (items ? '<ol>' + items + '</ol>' : '<p class="empty">Belum ada jadwal untuk hari ini.</p>')
                    + '</div>';
            }).join('');

            app.innerHTML = '<header class="card">'
                + '<p class="eyebrow">Rundown Acara</p>'
                + '<h1>' + escapeHtml(data.t) + '</h1>'
                + '<p class="meta">' + escapeHtml(formatDate(data.d)) + ' · ' + escapeHtml(data.v) + ', ' + escapeHtml(data.c) + '</p>'
                + '<p class="note">Halaman ini hanya menampilkan jadwal acara, bukan tiket masuk. QR tiket tetap dipakai untuk check-in di venue.</p>'
                + '</header>'
                + '<h2>Jadwal Penampilan</h2>'
                + (data.r && data.r.length > 0 ? list : '<p class="empty">Organizer belum mengisi rundown untuk acara ini.</p>')
                + '<footer>SoundTix · payload rundown</footer>';
        }

        if (!hash) {
            app.innerHTML = '<p class="empty">Payload rundown tidak ditemukan. Scan ulang QR dari halaman Tiket Saya.</p>';
            return;
        }

        try {
            render(decode(hash));
        } catch (error) {
            app.innerHTML = '<p class="empty">Payload rundown tidak valid. Scan ulang QR dari halaman Tiket Saya.</p>';
        }
    })();
</script>
</body>
</html>
